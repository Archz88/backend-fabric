<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17233A">
<title>Stok Kain &amp; Benang</title>
<link rel="manifest" href="manifest.json">
<style>
/* =========================================================
   Palet: indigo tua (tinta), greige (kain mentah),
   teal (bak celup), tiga warna grade.
   ========================================================= */
:root{
  --ink:#17233A; --ink-2:#2C3A55; --ground:#EFEBE2; --surface:#FFFFFF;
  --teal:#0E5C5B; --teal-2:#12807E;
  --gA:#1F7A4D; --gB:#A9760D; --gC:#B03A2E;
  --line:#D8D2C6; --muted:#6E6A61;
  --r:10px; --pad:14px;
  --fs:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--fs); background:var(--ground); color:var(--ink);
  font-size:16px; line-height:1.45;
  padding-bottom:calc(70px + env(safe-area-inset-bottom));
}
.num{font-variant-numeric:tabular-nums}

/* --- Bilah atas + motif lusi (helai benang di beam) --- */
header{
  position:sticky; top:0; z-index:30; background:var(--ink); color:#fff;
  padding-top:env(safe-area-inset-top);
}
.warp{
  height:6px;
  background:repeating-linear-gradient(90deg,
    rgba(255,255,255,.34) 0 1px, transparent 1px 4px);
}
.bar{display:flex; align-items:center; gap:8px; padding:9px 12px 10px}
.blok-judul{flex:1; min-width:0}
.blok-judul h1{font-size:15px; margin:0; font-weight:650; letter-spacing:.2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hsub{font-size:11.5px; color:#A9B3C6; margin-top:1px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hsub.err{color:#F0A868}
.ikon-btn{
  width:40px; height:40px; min-height:40px; flex:none; padding:0;
  background:rgba(255,255,255,.10); color:#fff; border-radius:9px;
  font-size:19px; line-height:1; display:flex; align-items:center; justify-content:center
}
.ikon-btn:active{background:rgba(255,255,255,.22)}
.ikon-btn.putar{animation:putar 1s linear infinite}
@keyframes putar{to{transform:rotate(360deg)}}
.antri{
  font-size:11px; background:#E0A93A; color:#3A2A00; border-radius:20px;
  padding:2px 9px; font-weight:700; display:none
}
.antri.on{display:inline-block}

/* --- Isian yang melebihi stok --- */
input.lebih{border-color:var(--gC); background:#FDF3F1}
.galat{color:var(--gC); font-size:12px; margin-top:6px; font-weight:600}

/* --- Baris keterangan di panel konfirmasi --- */
.fakta{display:flex; justify-content:space-between; gap:10px; padding:7px 0;
  border-bottom:1px solid #F0EDE6; font-size:13.5px}
.fakta:last-of-type{border-bottom:0}
.fakta b{font-variant-numeric:tabular-nums}
.fakta.tebal{border-top:1px solid var(--line); border-bottom:0; margin-top:4px;
  padding-top:9px; font-size:14.5px}
.pintas{display:flex; gap:8px; margin:10px 0 2px}
.pintas button{flex:1; min-height:42px; font-size:13.5px}
.pintas button.pilih{background:var(--teal); color:#fff}

/* --- Panel setelan --- */
.tirai{
  position:fixed; inset:0; z-index:50; background:rgba(23,35,58,.45);
  display:none; align-items:flex-end
}
.tirai.on{display:flex}
.panel{
  background:var(--ground); width:100%; max-height:88vh; overflow-y:auto;
  border-radius:16px 16px 0 0; padding-bottom:env(safe-area-inset-bottom)
}
.panel-bar{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px; background:var(--ink); color:#fff;
  border-radius:16px 16px 0 0; position:sticky; top:0
}
.panel-isi{padding:16px}
.panel-isi .card{margin-bottom:0}

main{padding:var(--pad); max-width:760px; margin:0 auto}

/* --- Label mikro: huruf kecil berjarak, meniru kode di kartu pabrik --- */
.eyebrow{
  font-size:10.5px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--muted); font-weight:700; margin:20px 0 8px
}
.eyebrow:first-child{margin-top:2px}

.card{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:var(--pad); margin-bottom:12px
}
.card h2{font-size:15px; margin:0 0 12px; font-weight:650}

label{display:block; font-size:12.5px; color:var(--muted); margin:11px 0 5px; font-weight:600}
input,select,textarea{
  width:100%; font:inherit; font-size:16px; padding:11px 12px;
  border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink)
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal-2); outline-offset:1px}
input[type=number]{font-variant-numeric:tabular-nums}
.baris{display:flex; gap:9px}
.baris>*{flex:1; min-width:0}

button{
  font:inherit; font-weight:650; border:0; border-radius:8px;
  padding:13px 16px; background:var(--ink); color:#fff; width:100%;
  min-height:48px; cursor:pointer
}
button:active{transform:translateY(1px)}
button.teal{background:var(--teal)}
button.garis{background:#fff; color:var(--ink); border:1px solid var(--line)}
button.kecil{width:auto; padding:9px 13px; font-size:13.5px; min-height:40px}
button[disabled]{opacity:.45}
.tombol-baris{display:flex; gap:9px; margin-top:14px}

/* --- Input per roll: satu baris per grade, tiap roll jadi keping
   yang bisa dibuang satu-satu. Pengelompokan ≥30/<30 dihitung
   aplikasi, bukan dijumlah manual oleh operator. --- */
.roll-grade{border-top:1px solid #F0EDE6; padding:11px 0 9px}
.roll-grade:first-of-type{border-top:0}
.roll-atas{display:flex; align-items:center; gap:8px}
.roll-atas .gl{font-weight:800; font-size:15px; width:20px; text-align:center; flex:none}
.roll-atas .gl.A{color:var(--gA)} .roll-atas .gl.B{color:var(--gB)} .roll-atas .gl.C{color:var(--gC)}
.roll-atas input{flex:1; padding:10px 10px; text-align:center}
.roll-atas button{
  flex:none; width:44px; min-height:44px; padding:0; font-size:20px;
  background:var(--ink); color:#fff; border-radius:8px
}
.keping{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; padding-left:28px}
.keping span{
  display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:650;
  background:#F2EFE8; border:1px solid var(--line); border-radius:16px;
  padding:5px 8px 5px 11px; font-variant-numeric:tabular-nums; cursor:pointer
}
.keping span i{font-style:normal; color:var(--gC); font-size:14px; line-height:1}
.keping span.pendek{background:#FBF4E4; border-color:#E8DCC0}
.ringkas{
  font-size:12px; color:var(--muted); margin-top:7px; padding-left:28px;
  font-variant-numeric:tabular-nums
}
.ringkas b{color:var(--ink)}

/* --- Kisi input grade lama, masih dipakai di layar lain --- */
.gk{display:grid; grid-template-columns:24px repeat(4,1fr); gap:5px; align-items:center}
.gk .h{
  font-size:9.5px; letter-spacing:.07em; text-transform:uppercase;
  color:var(--muted); font-weight:700; text-align:center; padding-bottom:1px
}
.gk .h.grup{grid-column:span 2; border-bottom:1px solid var(--line); padding-bottom:3px}
.gk .gl{font-weight:800; font-size:14px; text-align:center; line-height:1}
.gk input{padding:10px 3px; text-align:center; border-radius:7px}
.gk input::placeholder{color:#C9C4B8}
.gk .A{color:var(--gA)} .gk .B{color:var(--gB)} .gk .C{color:var(--gC)}
.gk-sela{height:5px; grid-column:1 / -1}

/* --- Tabel mini: dipakai di daftar antre dan pengelompokan stok.
   Angka rata kanan dan berkolom, jauh lebih mudah dicek ulang
   daripada satu baris memanjang ke samping. --- */
.mini{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:7px}
.mini th{
  font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
  font-weight:700; padding:3px 5px; border-bottom:1px solid var(--line); text-align:right
}
.mini th.kiri, .mini td.kiri{text-align:left}
.mini th.grup{text-align:center; border-bottom:1px solid var(--line)}
.mini td{padding:4px 5px; text-align:right; font-variant-numeric:tabular-nums;
  border-bottom:1px solid #F2EFE8}
.mini tr:last-child td{border-bottom:0}
.mini td.g{font-weight:800; text-align:left; width:20px}
.mini td.g.A{color:var(--gA)} .mini td.g.B{color:var(--gB)} .mini td.g.C{color:var(--gC)}
.mini td.nol{color:#C9C4B8}
.mini .pemisah{border-left:1px solid var(--line)}

/* --- Tabel hasil inspect: grade jadi kolom, kelas panjang jadi baris.
   Arah ini lebih enak dibaca karena grade adalah hal yang dibandingkan,
   sedangkan kelas panjang hanya dua kemungkinan. --- */
.tin{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:8px}
.tin th, .tin td{padding:4px 3px; text-align:right; font-variant-numeric:tabular-nums}
.tin th.kiri, .tin td.kiri{text-align:left; padding-left:0}
.tin .gh{
  font-size:12px; font-weight:800; text-align:center; padding-bottom:3px;
  border-bottom:1px solid var(--line)
}
.tin .gh.A{color:var(--gA)} .tin .gh.B{color:var(--gB)} .tin .gh.C{color:var(--gC)}
.tin .sat{
  font-size:9px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted);
  font-weight:700; padding-bottom:4px; border-bottom:1px solid var(--line)
}
.tin td.kiri{font-size:11.5px; color:var(--muted); white-space:nowrap}
.tin tr.jml td{
  border-top:1px solid var(--line); font-weight:700; padding-top:6px
}
.tin tr.jml td.kiri{font-size:11px; color:var(--ink); font-weight:700}
.tin td.nol{color:#C9C4B8}
.tin .sekat{border-left:1px solid #F0EDE6}

/* --- Rincian panjang tiap roll, untuk memeriksa roll per roll --- */
.roll-rinci{
  background:#F7F5EF; border-radius:7px; padding:7px 9px; margin-top:7px;
  font-variant-numeric:tabular-nums; line-height:1.7
}
.roll-rinci .tg{
  display:inline-block; min-width:16px; text-align:center; font-weight:800;
  font-size:11px; margin-right:5px
}
.roll-rinci .tg.A{color:var(--gA)} .roll-rinci .tg.B{color:var(--gB)}
.roll-rinci .tg.C{color:var(--gC)}

/* --- Kepala lokasi di layar stok --- */
.lok{
  display:flex; align-items:center; gap:8px; margin:0 0 10px;
  font-size:10.5px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--muted); font-weight:700
}
.lok::after{content:''; flex:1; height:1px; background:var(--line)}
.lok b{color:var(--ink); letter-spacing:.04em; font-size:12.5px; text-transform:none}

/* Angka roll dibuat redup: yang dipakai mengambil keputusan adalah meter. */
.rl{color:#A8A296; font-size:10.5px; font-weight:400; margin-left:5px}

/* --- Kelompok produk di layar stok --- */
.kelompok{margin-bottom:14px}
.kelompok:last-child{margin-bottom:0}
.kelompok .nama{
  display:flex; justify-content:space-between; align-items:baseline; gap:8px;
  padding-bottom:5px; border-bottom:2px solid var(--ink)
}
.kelompok .nama b{font-size:13.5px; font-weight:650}
.kelompok .nama .jml{font-size:13px; font-weight:700; font-variant-numeric:tabular-nums}

/* --- Kisi input ringkas untuk kirim proses --- */
.gp{display:grid; grid-template-columns:1fr 72px 54px; gap:5px; align-items:center}
.gp .h{
  font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted);
  font-weight:700; text-align:center; padding-bottom:2px; border-bottom:1px solid var(--line)
}
.gp .h.kiri{text-align:left}
.gp .nm{font-size:12.5px; line-height:1.25}
.gp .nm .ada{color:var(--muted); font-size:11.5px}
.gp input{padding:9px 4px; text-align:center; border-radius:7px}
.gp .judul-produk{
  grid-column:1 / -1; font-size:11px; font-weight:700; letter-spacing:.04em;
  color:var(--ink); padding:8px 0 2px
}

/* --- Daftar antre sebelum disimpan --- */
.daftar-kepala{
  display:flex; justify-content:space-between; align-items:baseline; margin-bottom:9px
}
.daftar-kepala .n{font-size:10.5px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); font-weight:700}
.item{
  border:1px solid var(--line); border-radius:9px; padding:10px 11px; margin-bottom:8px;
  display:flex; gap:10px; align-items:flex-start
}
.item .isi{flex:1; min-width:0}
.item .atas{display:flex; justify-content:space-between; gap:8px; font-size:13.5px}
.item .atas b{font-weight:650}
.item .rinci{font-size:12.5px; color:var(--muted); margin-top:3px; line-height:1.5}
.item .buang{
  flex:none; width:32px; height:32px; min-height:32px; padding:0; border-radius:7px;
  background:#F5F1EA; color:var(--gC); font-size:16px; font-weight:700
}
.total-baris{
  display:flex; justify-content:space-between; padding-top:9px; margin-top:2px;
  border-top:1px solid var(--line); font-size:13.5px
}
.total-baris b{font-variant-numeric:tabular-nums}
.grade{border:1px solid var(--line); border-radius:9px; padding:11px; margin-bottom:10px}
.grade .kepala{display:flex; align-items:center; gap:8px; margin-bottom:4px}
.pita{width:4px; height:17px; border-radius:2px}
.grade .kepala b{font-size:13.5px}
.gA .pita{background:var(--gA)} .gB .pita{background:var(--gB)} .gC .pita{background:var(--gC)}
.gA b{color:var(--gA)} .gB b{color:var(--gB)} .gC b{color:var(--gC)}

/* --- Tabel ringkas --- */
table{width:100%; border-collapse:collapse; font-size:13.5px}
th{
  text-align:left; font-size:10.5px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); padding:6px 5px; border-bottom:1px solid var(--line)
}
td{padding:8px 5px; border-bottom:1px solid #F0EDE6; vertical-align:top}
td.ka,th.ka{text-align:right}
td.ka{white-space:nowrap}
tr:last-child td{border-bottom:0}

.tag{
  display:inline-block; font-size:10.5px; font-weight:700; padding:2px 7px;
  border-radius:5px; background:#EDEAE2; color:var(--muted); letter-spacing:.03em
}
.tag.ready{background:#E3F1E9; color:var(--gA)}
.tag.naik{background:#E2EFF0; color:var(--teal)}
.tag.sisa{background:#FBF0D9; color:var(--gB)}
.tag.kosong{background:#EEEBE4; color:var(--muted)}
.tag.merah{background:#FAE7E4; color:var(--gC)}

.kosongpesan{color:var(--muted); font-size:13.5px; padding:14px 2px; text-align:center}

/* --- Pratinjau sebelum simpan --- */
.pratinjau{
  background:#F7F5EF; border:1px dashed var(--line); border-radius:9px;
  padding:12px; margin-top:14px; font-size:13.5px; display:none
}
.pratinjau.on{display:block}
.pratinjau .judul{font-size:10.5px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--muted); font-weight:700; margin-bottom:7px}
.pratinjau .isi div{display:flex; justify-content:space-between; padding:3px 0}
.pratinjau b{font-variant-numeric:tabular-nums}

/* --- Navigasi bawah: jempol, bukan mata --- */
nav{
  position:fixed; bottom:0; left:0; right:0; z-index:30;
  background:var(--surface); border-top:1px solid var(--line);
  display:flex; padding-bottom:env(safe-area-inset-bottom)
}
nav button{
  flex:1; background:none; color:var(--muted); border-radius:0;
  padding:9px 2px 8px; font-size:10.5px; font-weight:650; min-height:60px;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  border-top:2px solid transparent
}
nav button .ikon{font-size:19px; line-height:1}
nav button.aktif{color:var(--ink); border-top-color:var(--teal)}

/* --- Pesan --- */
#toast{
  position:fixed; left:50%; bottom:80px; transform:translateX(-50%) translateY(14px);
  background:var(--ink); color:#fff; padding:12px 18px; border-radius:9px;
  font-size:14px; max-width:88%; opacity:0; pointer-events:none;
  transition:opacity .18s, transform .18s; z-index:60; text-align:center
}
#toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
#toast.salah{background:var(--gC)}

.sub{font-size:12px; color:var(--muted)}
.pisah{height:1px; background:var(--line); margin:16px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="warp"></div>
  <div class="bar">
    <div class="blok-judul">
      <h1>Stok Kain &amp; Benang</h1>
      <div class="hsub" id="hsub">siap</div>
    </div>
    <span class="antri" id="antri">0 antre</span>
    <button class="ikon-btn" id="btn-sync" title="Sinkron">&#8635;</button>
    <button class="ikon-btn" id="btn-set" title="Setelan">&#9881;</button>
  </div>
</header>

<main id="layar"></main>

<nav>
  <button data-t="stok"   class="aktif"><span class="ikon">▤</span>Stok</button>
  <button data-t="kain"><span class="ikon">▦</span>Kain</button>
  <button data-t="beam"><span class="ikon">◎</span>Beam</button>
  <button data-t="benang"><span class="ikon">✳</span>Benang</button>
  <button data-t="proses"><span class="ikon">⇄</span>Proses</button>
  <button data-t="lain"><span class="ikon">⋯</span>Lainnya</button>
</nav>

<div id="tirai" class="tirai">
  <div class="panel">
    <div class="panel-bar">
      <b id="panel-judul">Setelan</b>
      <button class="ikon-btn" onclick="tutupPanel()">&#10005;</button>
    </div>
    <div class="panel-isi" id="panel-isi"></div>
  </div>
</div>

<div id="toast"></div>

<script>
/* =========================================================
   1. KONFIGURASI & UTILITAS
   ========================================================= */
const VERSI = '2026-09-03e';

const LS = {
  url   : 'kain.script_url',
  token : 'kain.token',
  cache : 'kain.cache',
  draft : 'kain.draft.',
  daftar: 'kain.daftar'
};

/* Token TIDAK ditanam di berkas ini. index.html berada di repo GitHub
   yang bisa dibaca siapa saja, jadi token yang ditulis di sini sama
   dengan menempelkannya di papan pengumuman. Token diisi sekali lewat
   Setelan dan hanya tersimpan di HP masing-masing. */
const CFG = {
  get url(){ return localStorage.getItem(LS.url) || ''; },
  set url(v){ localStorage.setItem(LS.url, v); },
  get token(){ return localStorage.getItem(LS.token) || ''; },
  set token(v){ localStorage.setItem(LS.token, v); },
  get siap(){ return !!(this.url && this.token); }
};

/* Semua data aplikasi ditaruh di satu tempat dan disimpan di HP.
   Berpindah tab hanya menggambar ulang dari sini — tidak menghubungi
   server sama sekali, jadi layarnya muncul seketika. Server hanya
   dihubungi saat tombol sinkron ditekan atau setelah menyimpan data. */
const S = {
  master: null, stok_kain: [], stok_benang: [], status_beam: [],
  wip: [], kartu: [], produksi: [],
  lastSync: null, sinkron: false, siapPakai: false
};

let TAB = 'stok';

function simpanCache(){
  try {
    localStorage.setItem(LS.cache, JSON.stringify({
      master: S.master, stok_kain: S.stok_kain, stok_benang: S.stok_benang,
      status_beam: S.status_beam, wip: S.wip, kartu: S.kartu,
      produksi: S.produksi, lastSync: S.lastSync
    }));
  } catch (e) {}
}

function muatCache(){
  try {
    const c = JSON.parse(localStorage.getItem(LS.cache) || 'null');
    if (!c || !c.master) return false;
    Object.assign(S, c);
    S.siapPakai = true;
    return true;
  } catch (e) { return false; }
}

/* batch_id: penanda anti-dobel. Dibuat sekali per submit dan
   dipakai ulang saat retry, supaya kiriman ganda ditolak server. */
function batchId(p){
  return p + '-' + Date.now().toString(36) + '-' +
         Math.random().toString(36).slice(2, 7);
}

function hariIni(){
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

/* Format angka gaya Indonesia: titik ribuan, koma desimal. */
function fmt(n, des){
  des = des === undefined ? 0 : des;
  const x = Number(n) || 0;
  return x.toLocaleString('id-ID', {minimumFractionDigits:des, maximumFractionDigits:des});
}

function esc(s){
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let toastTimer;
function toast(pesan, salah){
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = pesan;
  t.className = 'on' + (salah ? ' salah' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = '', 3200);
}

/* =========================================================
   2. KOMUNIKASI
   POST dulu, JSONP hanya sebagai cadangan.

   JSONP memuat tag <script src=...> — itu permintaan GET yang
   membawa cookie akun Google. Kalau di peramban ada akun yang
   login dan bukan pemilik skrip, Google mengalihkannya ke halaman
   pemilih akun; yang datang HTML, bukan JavaScript, jadi gagal.
   POST tidak melewati jalur itu, sehingga kebal terhadap akun mana
   pun yang sedang login. Jalur inilah yang dipakai app sparepart
   dan invoice, dan terbukti jalan di semua HP.
   ========================================================= */

/** Kesalahan aturan dari server (mis. "beam sudah naik") ditandai
 *  supaya tidak diulang lewat JSONP — jawabannya akan sama saja. */
function galatServer_(pesan){
  const e = new Error(pesan);
  e.dariServer = true;
  return e;
}

async function kirimPost_(action, payload){
  const r = await fetch(CFG.url, {
    method: 'POST',
    redirect: 'follow',
    // text/plain membuatnya jadi "simple request", tidak memicu preflight
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({action, token: CFG.token, data: payload || {}})
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const hasil = await r.json();
  if (hasil && hasil.ok === false) throw galatServer_(hasil.error || 'Gagal di server');
  return hasil;
}

function kirimJsonp_(action, payload){
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Math.random().toString(36).slice(2, 10);
    const s  = document.createElement('script');
    let selesai = false;

    const bereskan = () => {
      selesai = true;
      delete window[cb];
      if (s.parentNode) s.parentNode.removeChild(s);
      clearTimeout(jam);
    };

    const jam = setTimeout(() => {
      if (!selesai) { bereskan(); reject(new Error('Waktu habis — jaringan lambat')); }
    }, 25000);

    window[cb] = (hasil) => {
      if (selesai) return;
      bereskan();
      hasil && hasil.ok === false
        ? reject(galatServer_(hasil.error || 'Gagal di server'))
        : resolve(hasil);
    };

    const q = new URLSearchParams({
      action, token: CFG.token, callback: cb,
      data: JSON.stringify(payload || {})
    });
    s.src = CFG.url + '?' + q.toString();
    s.onerror = () => { if (!selesai) { bereskan(); reject(new Error('Tidak bisa menghubungi server')); } };
    document.body.appendChild(s);
  });
}

function panggil(action, payload){
  if (!CFG.url)   return Promise.reject(new Error('URL Apps Script belum diisi di Setelan'));
  if (!CFG.token) return Promise.reject(new Error('Token belum diisi di Setelan'));

  return kirimPost_(action, payload).catch(err => {
    if (err.dariServer) throw err;          // aturan, bukan jaringan
    return kirimJsonp_(action, payload);    // POST diblokir → coba jalur lama
  });
}

/* =========================================================
   3. ANTRIAN OFFLINE (IndexedDB)
   Submit selalu masuk antrian dulu, baru dikirim. Kalau
   jaringan mati, data aman dan dikirim ulang otomatis.
   ========================================================= */
let DB;
function bukaDB(){
  return new Promise((resolve, reject) => {
    const r = indexedDB.open('stok_kain', 1);
    r.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('antrian'))
        db.createObjectStore('antrian', {keyPath:'id', autoIncrement:true});
    };
    r.onsuccess = e => { DB = e.target.result; resolve(DB); };
    r.onerror   = () => reject(r.error);
  });
}

function dbTulis(rec){
  return new Promise((resolve, reject) => {
    const tx = DB.transaction('antrian', 'readwrite');
    const rq = tx.objectStore('antrian').add(rec);
    rq.onsuccess = () => resolve(rq.result);
    rq.onerror   = () => reject(rq.error);
  });
}

function dbSemua(){
  return new Promise((resolve, reject) => {
    const rq = DB.transaction('antrian', 'readonly').objectStore('antrian').getAll();
    rq.onsuccess = () => resolve(rq.result || []);
    rq.onerror   = () => reject(rq.error);
  });
}

function dbHapus(id){
  return new Promise((resolve) => {
    const rq = DB.transaction('antrian', 'readwrite').objectStore('antrian').delete(id);
    rq.onsuccess = rq.onerror = () => resolve();
  });
}

/** Titik masuk tunggal semua penyimpanan. */
async function kirim(action, payload, label){
  if (!DB) return panggil(action, payload);   // antrean belum siap, kirim langsung
  await dbTulis({action, payload, label, waktu: Date.now()});
  await perbaruiAntrian();
  return alirkan();
}

let sedangAlir = false;
async function alirkan(){
  if (sedangAlir || !navigator.onLine || !CFG.siap || !DB) return null;
  sedangAlir = true;
  let terakhir = null;
  try {
    const antre = await dbSemua();
    for (const item of antre) {
      try {
        terakhir = await panggil(item.action, item.payload);
        await dbHapus(item.id);
      } catch (e) {
        // Kesalahan aturan (mis. beam sudah naik) tidak akan sembuh
        // dengan diulang — buang dari antrian dan laporkan.
        if (/token|tidak dikenal|sudah|belum terdaftar|tidak ditemukan|harus/i.test(e.message)) {
          await dbHapus(item.id);
          toast(item.label + ': ' + e.message, true);
        } else {
          break;   // gangguan jaringan — pertahankan, coba lagi nanti
        }
      }
    }
  } finally {
    sedangAlir = false;
    await perbaruiAntrian();
  }
  return terakhir;
}

async function perbaruiAntrian(){
  const el = document.getElementById('antri');
  if (!el) return;                 // penanda tidak ada, bukan alasan menggagalkan sinkron
  let n = 0;
  try { n = DB ? (await dbSemua()).length : 0; } catch (e) {}
  el.textContent = n + ' antre';
  el.className = 'antri' + (n ? ' on' : '');
}

/* =========================================================
   5. SINKRONISASI
   Satu panggilan 'bootstrap' mengambil seluruh data sekaligus,
   menggantikan enam panggilan terpisah yang dulu terjadi tiap
   kali berpindah tab.
   ========================================================= */
async function sinkron(bersuara){
  if (!CFG.siap) {
    if (bersuara) toast('Isi dulu URL dan token lewat tombol roda gerigi', true);
    statusKepala();
    return false;
  }
  if (S.sinkron) return false;
  S.sinkron = true; statusKepala();
  try {
    await alirkan();                       // kirim antrean dulu
    const r = await panggil('bootstrap');
    if (!r || !r.data) throw new Error('Balasan server tidak lengkap');
    S.master      = r.data.master;
    S.stok_kain   = r.data.stok_kain   || [];
    S.stok_benang = r.data.stok_benang || [];
    S.status_beam = r.data.status_beam || [];
    S.wip         = r.data.wip         || [];
    S.kartu       = r.data.kartu       || [];
    S.produksi    = r.data.produksi    || [];
    S.lastSync    = new Date().toLocaleTimeString('id-ID',
                      {hour:'2-digit', minute:'2-digit'});
    S.siapPakai   = true;
    simpanCache();
    if (bersuara) toast('Data terbaru dimuat');
    return true;
  } catch (e) {
    if (bersuara) toast(e.message, true);
    return false;
  } finally {
    S.sinkron = false;
    statusKepala();
    gambar();
  }
}

function statusKepala(){
  const sub = document.getElementById('hsub');
  const tb  = document.getElementById('btn-sync');
  if (!sub) return;
  if (tb) tb.classList.toggle('putar', S.sinkron);
  let teks, salah = false;
  if (!CFG.siap)         { teks = 'server belum diatur'; salah = true; }
  else if (S.sinkron)    { teks = 'menyinkronkan…'; }
  else if (!navigator.onLine) { teks = 'mode luring — data tersimpan di HP'; salah = true; }
  else if (S.lastSync)   { teks = 'tersinkron ' + S.lastSync; }
  else                   { teks = 'siap'; }
  sub.textContent = teks;
  sub.className = 'hsub' + (salah ? ' err' : '');
}

/* ---------- 6a. STOK ---------- */

/** Kumpulkan array of object jadi peta berdasarkan satu kunci. */
function perKunci(daftar, ambilKunci){
  const peta = {};
  daftar.forEach(d => {
    const k = ambilKunci(d);
    (peta[k] = peta[k] || []).push(d);
  });
  return peta;
}

/** Sel angka: meter tebal, jumlah roll redup di sampingnya. */
function selMeter(meter, roll, kelas){
  if (!meter) return `<td class="nol ${kelas || ''}">–</td>`;
  return `<td class="${kelas || ''}"><b>${fmt(meter)}</b>` +
         (roll ? `<span class="rl">${fmt(roll)} rl</span>` : '') + `</td>`;
}

/**
 * Tabel greige satu produk: kolom grade, baris kelas panjang.
 * Bentuknya sengaja disamakan dengan tabel di tab Kain supaya
 * angka hasil inspect dan angka stok dibaca dengan cara yang sama.
 */
function tabelGreige(baris, batas){
  const grades = ['A','B','C'].filter(g => baris.some(b => b.grade === g));
  if (!grades.length) return '';

  const ambil = (g, k) => baris.find(b => b.grade === g && b.kelas_panjang === k);

  const barisKelas = (kelas, label) => `<tr>
    <td class="kiri">${label}</td>
    ${grades.map((g, i) => {
      const b = ambil(g, kelas);
      return selMeter(b ? b.qty : 0, b ? b.roll : 0, i ? 'sekat' : '');
    }).join('')}
  </tr>`;

  return `<table class="tin">
    <tr><th class="kiri"></th>
      ${grades.map((g, i) => `<th class="gh ${g} ${i ? 'sekat' : ''}">Grade ${g}</th>`).join('')}</tr>
    ${barisKelas('L30', '≥' + batas + ' m')}
    ${barisKelas('S30', '<' + batas + ' m')}
    <tr class="jml"><td class="kiri">Total</td>
      ${grades.map((g, i) => {
        const isi = baris.filter(b => b.grade === g);
        return selMeter(isi.reduce((a, b) => a + b.qty, 0),
                        isi.reduce((a, b) => a + b.roll, 0), i ? 'sekat' : '');
      }).join('')}</tr>
  </table>`;
}

function layarStok(el){
  const batas = AMBANG();

  // Kain di tempat proses dipisah sepenuhnya: begitu dikirim, grade dan
  // panjangnya sudah tercampur di sana, jadi memecahnya lagi per grade
  // akan menampilkan rincian yang tidak bisa diverifikasi di lapangan.
  const lokProses = {};
  M.lokasi('Proses').forEach(l => lokProses[l.kode] = true);
  const namaLok = {}, urutLok = {};
  (S.master?.Master_Lokasi || []).forEach((l, i) => {
    namaLok[l.kode] = l.nama; urutLok[l.kode] = i;
  });
  const nl = k => namaLok[k] || k;
  const urutkanLok = a => a.sort((x, y) =>
    (urutLok[x] === undefined ? 99 : urutLok[x]) - (urutLok[y] === undefined ? 99 : urutLok[y]));

  const greige   = S.stok_kain.filter(s => s.satuan === 'm'    && !lokProses[s.lokasi]);
  const finished = S.stok_kain.filter(s => s.satuan === 'yard' && !lokProses[s.lokasi]);
  const diProses = S.stok_kain.filter(s => lokProses[s.lokasi]);

  const jml = (a, f) => a.reduce((x, y) => x + (f ? f(y) : y.qty), 0);

  // --- Greige: lokasi dulu, baru produk ---
  const perLokasi = perKunci(greige, s => s.lokasi);
  const isiGreige = urutkanLok(Object.keys(perLokasi)).map(lok => {
    const perProduk = perKunci(perLokasi[lok], s => s.kode_produk);
    return `<div class="card">
      <div class="lok">Lokasi <b>${esc(nl(lok))}</b></div>
      ${Object.keys(perProduk).sort().map(kode => `
        <div class="kelompok">
          <div class="nama"><b>${esc(M.namaProduk(kode))}</b>
            <span class="jml">${fmt(jml(perProduk[kode]))} m</span></div>
          ${tabelGreige(perProduk[kode], batas)}
        </div>`).join('')}
    </div>`;
  }).join('');

  // --- Kain jadi: tanpa grade, cukup per lokasi dan produk ---
  const perLokJadi = perKunci(finished, s => s.lokasi);
  const isiJadi = urutkanLok(Object.keys(perLokJadi)).map(lok => `
    <div class="card">
      <div class="lok">Lokasi <b>${esc(nl(lok))}</b></div>
      <table class="mini">
        ${perLokJadi[lok].map(s => `<tr>
          <td class="kiri">${esc(M.namaProduk(s.kode_produk))}</td>
          <td><b>${fmt(s.qty)}</b> <span class="rl">yard</span></td>
          <td class="nol">${s.roll ? fmt(s.roll) + ' rl' : ''}</td>
        </tr>`).join('')}
      </table>
    </div>`).join('');

  // --- Di tempat proses: digabung, tidak dipecah per grade ---
  const perLokProses = perKunci(diProses, s => s.lokasi);
  const isiProses = urutkanLok(Object.keys(perLokProses)).map(lok => {
    const perProduk = perKunci(perLokProses[lok], s => s.kode_produk);
    const poLok = {};
    S.wip.filter(w => w.lokasi === lok).forEach(w => {
      poLok[w.no_po] = (poLok[w.no_po] || 0) + w.sisa_m;
    });
    return `<div class="card">
      <div class="lok">Di <b>${esc(nl(lok))}</b></div>
      <table class="mini">
        ${Object.keys(perProduk).sort().map(kode => `<tr>
          <td class="kiri">${esc(M.namaProduk(kode))}</td>
          <td><b>${fmt(jml(perProduk[kode]))}</b> <span class="rl">m</span></td>
        </tr>`).join('')}
      </table>
      ${Object.keys(poLok).length ? `<div class="lok" style="margin:12px 0 8px">Per PO</div>
        <table class="mini">
          ${Object.keys(poLok).sort().map(po => `<tr>
            <td class="kiri"><b>${esc(po)}</b></td>
            <td><b>${fmt(poLok[po])}</b> <span class="rl">m</span></td>
          </tr>`).join('')}
        </table>` : ''}
    </div>`;
  }).join('');

  const siap  = S.status_beam.filter(b => /Ready/.test(b.status));
  const jalan = S.status_beam.filter(b => b.status === 'Naik');

  el.innerHTML = `
    <div class="eyebrow">Beam</div>
    <div class="card">
      <div class="baris">
        <div><div class="sub">Siap dipakai</div>
          <div class="num" style="font-size:26px;font-weight:700">${siap.length}</div></div>
        <div><div class="sub">Jalan di mesin</div>
          <div class="num" style="font-size:26px;font-weight:700">${jalan.length}</div></div>
      </div>
    </div>

    <div class="eyebrow">Kain greige — ${fmt(jml(greige))} meter</div>
    ${isiGreige || '<div class="card"><div class="kosongpesan">Belum ada stok. Mulai dari tab Kain.</div></div>'}

    <div class="eyebrow">Kain hasil proses — ${fmt(jml(finished))} yard</div>
    ${isiJadi || '<div class="card"><div class="kosongpesan">Belum ada kain hasil proses.</div></div>'}

    <div class="eyebrow">Kain di tempat proses — ${fmt(jml(diProses))} meter</div>
    ${isiProses || '<div class="card"><div class="kosongpesan">Tidak ada kain yang sedang diproses.</div></div>'}

    <div class="eyebrow">Benang</div>
    <div class="card">${S.stok_benang.length
      ? `<table class="mini"><tr><th class="kiri">Benang</th><th class="kiri">Lot</th><th>Kg</th></tr>
         ${S.stok_benang.map(b => `<tr><td class="kiri">${esc(b.kode_benang)}</td>
           <td class="kiri">${esc(b.lot)}</td>
           <td><b>${fmt(b.kg, 1)}</b></td></tr>`).join('')}</table>`
      : '<div class="kosongpesan">Belum ada benang tercatat.</div>'}</div>

    <div class="eyebrow">Produksi per mesin</div>
    <div class="card">${S.produksi.length
      ? `<table class="mini"><tr><th class="kiri">Mesin</th><th>Total (m)</th>
         <th>% B+C</th><th>m/hari</th></tr>
         ${S.produksi.map(r => `<tr><td class="kiri"><b>Mesin ${esc(r.no_mesin)}</b></td>
           <td>${fmt(r.total)}</td>
           <td>${r.pct_BC === '' ? '–' : fmt(r.pct_BC,1) + '%'}</td>
           <td>${r.per_hari === '' ? '–' : fmt(r.per_hari)}</td></tr>`).join('')}</table>`
      : '<div class="kosongpesan">Belum ada data produksi.</div>'}</div>`;
}

/* ---------- 6b. INPUT KAIN ---------- */
/* Pola daftar: isi formulir -> Tambah ke daftar -> periksa daftarnya
   -> Simpan semua ke database. Sama seperti app sparepart, supaya
   beberapa mesin bisa diinput sekaligus dan salah ketik masih bisa
   dibuang sebelum apa pun masuk ke ledger. */

let DAFTAR = [];
try { DAFTAR = JSON.parse(localStorage.getItem(LS.daftar) || '[]'); } catch (e) { DAFTAR = []; }
function simpanDaftar(){ localStorage.setItem(LS.daftar, JSON.stringify(DAFTAR)); }

/* Panjang tiap roll yang sedang diketik, per grade. Aplikasi yang
   mengelompokkan ke ≥30 m / <30 m — operator cukup menyebut angkanya
   satu per satu, persis seperti membaca hasil inspect. */
let ROLL = {A: [], B: [], C: []};

/** Ambang kelas panjang diambil dari CONFIG di Kain.gs, bukan ditulis mati. */
function AMBANG(){
  return Number(S.master?.config?.ambang_panjang_m) || 30;
}

/** Terima "30 100 120 40", "30,100", atau satu angka saja. */
function tambahRoll(g){
  const el = document.getElementById('in' + g);
  // Pemisah bisa spasi, koma, atau tanda apa pun yang bukan angka.
  // Titik tetap dibaca sebagai desimal, jadi "30.5" satu roll,
  // sedangkan "30,100" jadi dua roll.
  const angka = String(el.value).split(/[^0-9.]+/)
    .map(Number)
    .filter(n => n > 0);

  if (!angka.length) return toast('Isi dulu panjang rollnya', true);
  ROLL[g] = ROLL[g].concat(angka);
  el.value = '';
  el.focus();
  gambarRoll(g);
}

function buangRoll(g, i){
  ROLL[g].splice(i, 1);
  gambarRoll(g);
}

function gambarRoll(g){
  const kp = document.getElementById('kp' + g);
  const rk = document.getElementById('rk' + g);
  if (!kp) return;
  const batas = AMBANG();

  kp.innerHTML = ROLL[g].map((m, i) =>
    `<span class="${m < batas ? 'pendek' : ''}" onclick="buangRoll('${g}',${i})">
       ${fmt(m)} <i>&times;</i></span>`).join('');

  const panjang = ROLL[g].filter(m => m >= batas);
  const pendek  = ROLL[g].filter(m => m <  batas);
  const jml = a => a.reduce((x, y) => x + y, 0);

  rk.innerHTML = ROLL[g].length
    ? `≥${batas} m: <b>${panjang.length} rl / ${fmt(jml(panjang))} m</b>` +
      ` &nbsp;·&nbsp; &lt;${batas} m: <b>${pendek.length} rl / ${fmt(jml(pendek))} m</b>` +
      ` &nbsp;·&nbsp; total <b>${fmt(jml(ROLL[g]))} m</b>`
    : '';
}

/** Greige selalu disimpan di pabrik, jadi lokasinya tidak ditanyakan. */
function lokasiPabrik(){
  const int = M.lokasi('Internal');
  const pab = int.find(l => String(l.kode).toUpperCase() === 'PABRIK');
  return (pab || int[0] || {kode:'PABRIK'}).kode;
}

      </div>
      <div class="keping" id="kp${g}"></div>

    </div>`;

    <div class="eyebrow">Hasil inspect</div>
    <div class="card">
      <div class="baris">

        <div><label for="k_tgl">Tanggal inspect</label>

      <div class="baris">
        <div><label for="k_produk">Produk greige</label>
          <select id="k_produk">${opsi(greige, 'kode', 'nama')}</select></div>
        <div><label for="k_beam">Beam</label>
          <select id="k_beam"><option value="">— tidak diketahui —</option>
            ${opsi(beam.data.filter(b => b.status !== 'Kosong'), 'no_beam',
                   b => 'Beam ' + b.no_beam + (b.status === 'Naik' ? ' (mesin ' + b.no_mesin + ')' : ''))}
          </select></div>
      </div>

      <div class="pisah"></div>
      <div class="eyebrow" style="margin-top:0">Panjang tiap roll</div>
      <p class="sub" style="margin:-4px 0 4px">Masukkan panjang per roll, boleh beberapa
      sekaligus dipisah spasi atau koma. Pembagian ≥${batas} m dan di bawahnya dihitung
      sendiri. Ketuk keping untuk membuangnya.</p>

      ${barisGrade('A')}${barisGrade('B')}${barisGrade('C')}

      <div class="tombol-baris">
        <button class="garis" onclick="tambahDaftar()">+ Tambah ke daftar</button>
      </div>
    </div>

    <div class="card">
      <div class="daftar-kepala">
        <span class="n">Daftar siap simpan</span>

      <div id="k_daftar"></div>
    </div>

    <button class="teal" id="k_simpan" onclick="simpanDaftarKeDB()"
      ${DAFTAR.length ? '' : 'disabled'}>Simpan semua ke database</button>
    <p class="sub" style="text-align:center;margin:9px 0 0">
      Periksa dulu daftar di atas. Setelah disimpan, koreksi dibuat sebagai baris baru.</p>`;

  // Beam mengikuti mesin yang dipilih — kain biasanya dari beam yang
  // sedang jalan, tapi tetap bisa diganti kalau beamnya sudah turun.
  const setBeam = () => {
    const nm = document.getElementById('k_mesin').value;
    const aktif = beam.data.find(b => b.status === 'Naik' && String(b.no_mesin) === String(nm));
    document.getElementById('k_beam').value = aktif ? aktif.no_beam : '';
  };
  document.getElementById('k_mesin').addEventListener('change', setBeam);
  setBeam();
  ['A','B','C'].forEach(gambarRoll);
  gambarDaftar();

function gambarDaftar(){
  const box = document.getElementById('k_daftar');
  if (!box) return;

  if (!DAFTAR.length) {
    box.innerHTML = `<div class="kosongpesan"><b>Daftar masih kosong</b><br>
      Isi formulir di atas, lalu tekan "+ Tambah ke daftar".</div>`;
    return;
  }

  const batas = AMBANG();
  let totalM = 0, totalR = 0;

  box.innerHTML = DAFTAR.map((d, i) => {
    // Hanya grade yang benar-benar terisi yang ditampilkan, supaya
    // tabelnya tetap sempit kalau cuma grade A yang ada.
    const grades = ['A','B','C'].filter(g => d.baris.some(b => b.grade === g));
    const ambil  = (g, k) => d.baris.find(b => b.grade === g && b.kelas === k);

    const m = d.baris.reduce((a, b) => a + b.meter, 0);
    const r = d.baris.reduce((a, b) => a + b.roll, 0);
    totalM += m; totalR += r;

    const sel = (v, kelas) => v
      ? `<td class="${kelas || ''}">${fmt(v)}</td>`
      : `<td class="nol ${kelas || ''}">–</td>`;

    const barisKelas = (kelas, label) => `<tr>
      <td class="kiri">${label}</td>
      ${grades.map((g, idx) => {
        const b = ambil(g, kelas);
        return sel(b ? b.meter : 0, idx ? 'sekat' : '') + sel(b ? b.roll : 0);
      }).join('')}
    </tr>`;

    const barisJumlah = `<tr class="jml">
      <td class="kiri">Total</td>
      ${grades.map((g, idx) => {
        const isi = d.baris.filter(b => b.grade === g);
        const gm = isi.reduce((a, b) => a + b.meter, 0);
        const gr = isi.reduce((a, b) => a + b.roll, 0);
        return `<td class="${idx ? 'sekat' : ''}">${fmt(gm)}</td><td>${fmt(gr)}</td>`;
      }).join('')}
    </tr>`;

    return `<div class="item">
      <div class="isi">
        <div class="atas"><b>Mesin ${esc(d.no_mesin)}</b>
          <span class="sub">${esc(d.tanggal)}</span></div>
        <div class="rinci">${esc(M.namaProduk(d.kode_produk))}
          ${d.no_beam ? '· beam ' + esc(d.no_beam) : '· beam tidak diketahui'}</div>
        ${d.baris.some(b => b.rincian) ? `<div class="rinci roll-rinci">
          ${grades.map(g => {
            const r = d.baris.filter(b => b.grade === g)
                             .flatMap(b => b.rincian || []).sort((x, y) => y - x);
            return r.length
              ? `<span class="tg ${g}">${g}</span> ${r.map(v => fmt(v)).join(', ')}`
              : '';
          }).filter(String).join('<br>')}
        </div>` : ''}

        <table class="tin">
          <tr><th class="kiri"></th>
            ${grades.map((g, idx) => `<th class="gh ${g} ${idx ? 'sekat' : ''}" colspan="2">${g}</th>`).join('')}</tr>
          <tr><th class="kiri"></th>
            ${grades.map((g, idx) => `<th class="sat ${idx ? 'sekat' : ''}">m</th><th class="sat">rl</th>`).join('')}</tr>
          ${barisKelas('L30', '≥' + batas + ' m')}
          ${barisKelas('S30', '<' + batas + ' m')}
          ${barisJumlah}
        </table>

        <div class="total-baris" style="margin-top:8px">
          <span>Mesin ${esc(d.no_mesin)}</span>
          <b>${fmt(m)} m · ${fmt(r)} roll</b>
        </div>
      </div>
      <button class="buang" onclick="buangDaftar(${i})" title="Buang">&#10005;</button>
    </div>`;
  }).join('') + (DAFTAR.length > 1
    ? `<div class="total-baris"><span>Total semua mesin</span>
        <b>${fmt(totalM)} m · ${fmt(totalR)} roll</b></div>`
    : '');
}

function tambahDaftar(){
  const g = id => document.getElementById(id);
  const batas = AMBANG();
  const baris = [];

  ['A','B','C'].forEach(gr => {
    [['L30', m => m >= batas], ['S30', m => m < batas]].forEach(([kelas, cocok]) => {
      const isi = ROLL[gr].filter(cocok);
      if (!isi.length) return;
      baris.push({
        grade: gr, kelas,
        meter: isi.reduce((a, b) => a + b, 0),
        roll : isi.length,
        rincian: isi.slice()        // panjang tiap roll, ikut tercatat di ledger
      });
    });
  });

  if (!baris.length) return toast('Belum ada roll yang dimasukkan', true);

  DAFTAR.push({
    batch_id   : batchId('KAIN'),
    tanggal    : g('k_tgl').value,
    no_mesin   : g('k_mesin').value,
    no_beam    : g('k_beam').value,
    kode_produk: g('k_produk').value,
    lokasi     : lokasiPabrik(),
    baris
  });
  simpanDaftar();

  ROLL = {A: [], B: [], C: []};
  const total = baris.reduce((a, b) => a + b.meter, 0);
  const roll  = baris.reduce((a, b) => a + b.roll, 0);
  toast(`Ditambahkan — ${fmt(roll)} roll, ${fmt(total)} m`);
  layarKain(document.getElementById('layar'));
}

function buangDaftar(i){
  DAFTAR.splice(i, 1);
  simpanDaftar();
  layarKain(document.getElementById('layar'));
}

async function simpanDaftarKeDB(){
  if (!DAFTAR.length) return toast('Daftar masih kosong', true);
  const tb = document.getElementById('k_simpan');
  tb.disabled = true;
  tb.textContent = 'Menyimpan…';

  const gagal = [];
  const sisa  = [];
  for (const d of DAFTAR) {
    try {
      await kirim('inputKain', d, 'Input kain mesin ' + d.no_mesin);
    } catch (e) {
      gagal.push('Mesin ' + d.no_mesin + ': ' + e.message);
      sisa.push(d);                      // yang gagal tetap di daftar
    }
  }

  DAFTAR = sisa;
  simpanDaftar();
  await sinkron(false);
  toast(gagal.length ? gagal[0] : 'Semua tersimpan', gagal.length > 0);
}

/** Pratinjau pihane: berat benang dan gram per helai dihitung di layar
 *  supaya salah timbang atau salah ketik helai ketahuan sebelum disimpan. */
function praPihane(){
  const g = id => document.getElementById(id);
  if (!g('b_no')) return;
  const beam  = S.status_beam.find(b => String(b.no_beam) === String(g('b_no').value));
  const kosong = beam ? Number(beam.berat_kosong_kg) || 0 : 0;
  const isi   = Number(g('b_berat').value) || 0;
  const helai = Number(g('b_helai').value) || 0;
  const tarik = Number(g('b_tarik').value) || 0;
  const kg    = isi - kosong;

  const box = g('b_pra');
  if (!isi) {
    box.innerHTML = `<div class="judul">Perhitungan</div>
      <div class="isi"><div><span>Berat beam kosong</span><b>${fmt(kosong,1)} kg</b></div>
      <div class="sub" style="padding-top:4px">Isi berat beam terisi untuk melihat hitungannya.</div></div>`;
    return;
  }

  // Gram per helai per meter — angka kecil yang gampang dibandingkan
  // antar beam. Kalau melenceng jauh, ada yang salah timbang atau salah hitung helai.
  const gpm = (helai && tarik) ? (kg * 1000) / (helai * tarik) : null;

  box.innerHTML = `<div class="judul">Perhitungan</div><div class="isi">
    <div><span>Berat beam kosong</span><b>${fmt(kosong,1)} kg</b></div>
    <div><span>Berat benang di beam</span><b>${fmt(kg,1)} kg</b></div>
    ${helai ? `<div><span>Total helai lusi</span><b>${fmt(helai)}</b></div>` : ''}
    ${tarik ? `<div><span>Panjang tarikan</span><b>${fmt(tarik)} m</b></div>` : ''}
    ${gpm !== null ? `<div style="border-top:1px solid var(--line);margin-top:6px;padding-top:6px">
      <span>Gram per helai per meter</span><b>${gpm.toFixed(4)}</b></div>` : ''}
    ${kg <= 0 ? '<div class="sub" style="color:var(--gC);padding-top:4px">Berat terisi harus lebih besar dari berat beam kosong.</div>' : ''}
  </div>`;
}

async function kirimPihane(){
  const g = id => document.getElementById(id).value;
  if (!g('b_no'))    return toast('Tidak ada beam kosong yang bisa diisi', true);
  if (!g('b_lot'))   return toast('Nomor lot belum diisi', true);
  if (!Number(g('b_berat'))) return toast('Berat beam terisi belum diisi', true);
  try {
    const r = await kirim('isiBeam', {
      batch_id: batchId('BEAM'), tanggal: g('b_tgl'), no_beam: g('b_no'),
      kode_benang: g('b_benang'), lot: g('b_lot'), berat_isi_kg: Number(g('b_berat')),
      helai_lusi: Number(g('b_helai')) || 0,
      panjang_tarikan_m: Number(g('b_tarik')) || 0,
      kode_produk: g('b_produk')
    }, 'Pihane');
    toast(r ? `Pihane tersimpan — ${fmt(r.kg_benang, 1)} kg benang` : 'Masuk antrian');
    await sinkron(false);
  } catch (e) { toast(e.message, true); }
}

async function kirimNaik(){
  const g = id => document.getElementById(id).value;
  if (!g('n_beam')) return toast('Tidak ada beam yang siap naik', true);
  try {
    const r = await kirim('naikBeam', {
      batch_id: batchId('NAIK'), tanggal: g('n_tgl'),
      no_beam: g('n_beam'), no_mesin: g('n_mesin')
    }, 'Naik beam');
    toast(r && r.turun_otomatis
      ? `Beam ${g('n_beam')} naik — beam ${r.turun_otomatis} turun otomatis`
      : `Beam ${g('n_beam')} naik ke mesin ${g('n_mesin')}`);
    await sinkron(false);
  } catch (e) { toast(e.message, true); }
}

function pilihSisa(habis){
  document.getElementById('tr_habis').classList.toggle('pilih', habis);
  document.getElementById('tr_sisa').classList.toggle('pilih', !habis);
  document.getElementById('tr_kotak').style.display = habis ? 'none' : 'block';
  if (habis) document.getElementById('tr_kg').value = '';
}

async function jalankanTurun(no){
  const habis = document.getElementById('tr_habis').classList.contains('pilih');
  const kg = habis ? 0 : Number(document.getElementById('tr_kg').value) || 0;
  if (!habis && kg <= 0) return toast('Isi dulu berapa kg sisanya', true);

  tutupPanel();
  try {
    await kirim('turunBeam', {
      batch_id: batchId('TURUN'), tanggal: document.getElementById('tr_tgl')
        ? document.getElementById('tr_tgl').value : hariIni(),
      no_beam: no, sisa_kg: kg
    }, 'Turun beam');
    toast(kg > 0 ? `Beam ${no} turun — sisa ${fmt(kg,1)} kg` : `Beam ${no} turun, benang habis`);
    await sinkron(false);
  } catch (e) { toast(e.message, true); }

/**
 * Penjaga stok: kotak yang melebihi stok tersedia diberi tanda merah
 * dan tombol simpan dimatikan. Tanpa ini stok bisa jadi minus diam-diam,
 * dan salahnya baru ketahuan berminggu-minggu kemudian saat opname.
 */
function pasangJaga(wadah, idTombol, idGalat, satuan){
  const kotak = [...wadah.querySelectorAll('.jaga')];
  const tb = document.getElementById(idTombol);
  const pesan = document.getElementById(idGalat);

  const periksa = () => {
    const lebih = [];
    kotak.forEach(el => {
      const maks = Number(el.dataset.maks);
      const isi  = Number(el.value) || 0;
      const salah = isi > maks + 0.001;
      el.classList.toggle('lebih', salah);
      if (salah) lebih.push({el, maks, isi});
    });
    if (tb) tb.disabled = lebih.length > 0;
    if (pesan) {
      pesan.style.display = lebih.length ? 'block' : 'none';
      pesan.textContent = lebih.length
        ? (lebih.length === 1
            ? `Melebihi stok — tersedia ${fmt(lebih[0].maks)} ${satuan}, diisi ${fmt(lebih[0].isi)}`
            : `${lebih.length} baris melebihi stok yang tersedia`)
        : '';
    }
  };

  kotak.forEach(el => { el.addEventListener('input', periksa); });
  periksa();
}

async function kirimKeProses(){
  const g = id => document.getElementById(id).value;
  if (!g('c_po')) return toast('Nomor PO belum diisi', true);

  const qty  = [...document.querySelectorAll('.c_qty')];
  const roll = [...document.querySelectorAll('.c_roll')];
  const baris = qty.map((el, i) => ({
    kode_produk: el.dataset.p, grade: el.dataset.g, kelas: el.dataset.k,
    qty: Number(el.value) || 0, roll: Number(roll[i]?.value) || 0
  })).filter(b => b.qty > 0);

  if (!baris.length) return toast('Belum ada kain yang diisi', true);

  try {
    const r = await kirim('kirimProses', {
      batch_id: batchId('KIRIM'), no_po: g('c_po'), tempat_proses: g('c_tempat'),
      tanggal: g('c_tgl'), lokasi_asal: g('c_asal'), baris
    }, 'Kirim proses');
    toast(r ? `Terkirim — ${fmt(r.meter_saya)} m` : 'Masuk antrian');
    await sinkron(false);
    await sinkron(false);
  } catch (e) { toast(e.message, true); }
}

async function kirimTerima(){
  const g = id => document.getElementById(id).value;
  const input = [...document.querySelectorAll('.t_in')].map(el => ({
    kode_produk: el.dataset.p, grade: el.dataset.g,
    kelas: el.dataset.k, qty: Number(el.value) || 0

  if (!input.length) return toast('Greige yang terpakai belum diisi', true);
  if (!Number(g('t_yard'))) return toast('Yard kain jadi belum diisi', true);

  try {
    const r = await kirim('terimaProses', {
      batch_id: batchId('TERIMA'), no_po: g('t_po'), tanggal: g('t_tgl'),
      lokasi_tujuan: g('t_tujuan'), input,
      meter_mereka: Number(g('t_meter')) || 0,

    </div>`
    : '<div class="kosongpesan">Belum ada stok yang bisa dijual.</div>';

  if (ada.length) pasangJaga(document.getElementById('jual_card'), 'j_simpan', 'j_galat', '');

  document.getElementById('opname_card').innerHTML = ada.length ? `
    <p class="sub" style="margin:0 0 10px">Isi hasil hitung fisik. Selisihnya dihitung
    dan dicatat sendiri — angka sistem tidak ditimpa.</p>
    ${ada.map((s, i) => `
      <div style="margin-bottom:8px">
        <label for="o_${i}">${esc(M.namaProduk(s.kode_produk))}
          ${s.grade ? '· ' + esc(s.grade) : ''} · ${esc(s.lokasi)}
          <span class="sub">(sistem: ${fmt(s.qty)} ${esc(s.satuan)})</span></label>
        <input type="number" inputmode="decimal" id="o_${i}" class="o_fisik"
          placeholder="hasil hitung fisik"
          data-p="${esc(s.kode_produk)}" data-g="${esc(s.grade)}" data-k="${esc(s.kelas_panjang)}"
          data-l="${esc(s.lokasi)}" data-s="${esc(s.satuan)}" data-sistem="${s.qty}">
      </div>`).join('')}
    <div class="tombol-baris"><button onclick="kirimOpname()">Periksa &amp; simpan</button></div>`
    : '<div class="kosongpesan">Belum ada stok untuk diopname.</div>';

  document.getElementById('kartu_card').innerHTML = S.kartu.length
    ? `<table>${S.kartu.map(r => `<tr>
        <td class="sub" style="white-space:nowrap">${esc(String(r.timestamp).slice(5,16))}</td>
        <td>${esc(r.keterangan)}</td></tr>`).join('')}</table>`
    : '<div class="kosongpesan">Belum ada riwayat.</div>';
}

async function kirimJual(){
  const cust = document.getElementById('j_cust').value;
  const tgl  = document.getElementById('j_tgl').value;
  if (!cust) return toast('Nama pelanggan belum diisi', true);

  const qty  = [...document.querySelectorAll('.j_qty')];
  const roll = [...document.querySelectorAll('.j_roll')];
  const baris = qty.map((el, i) => ({
    kode_produk: el.dataset.p, grade: el.dataset.g, kelas: el.dataset.k,
    lokasi: el.dataset.l, satuan: el.dataset.s,
    qty: Number(el.value) || 0, roll: Number(roll[i]?.value) || 0
  })).filter(b => b.qty > 0);

  if (!baris.length) return toast('Belum ada kain yang diisi', true);
  try {
    await kirim('jualKain', {batch_id: batchId('JUAL'), tanggal: tgl, customer: cust, baris}, 'Jual kain');
    toast('Penjualan tersimpan');
    await sinkron(false);
  } catch (e) { toast(e.message, true); }
}

async function kirimOpname(){
  const baris = [...document.querySelectorAll('.o_fisik')]
    .filter(el => el.value !== '')
    .map(el => ({
      kode_produk: el.dataset.p, grade: el.dataset.g, kelas: el.dataset.k,
      lokasi: el.dataset.l, satuan: el.dataset.s,
      fisik: Number(el.value), sistem: Number(el.dataset.sistem) || 0
    }));
  if (!baris.length) return toast('Belum ada hasil hitung yang diisi', true);

  // Selisihnya diperlihatkan dulu. Koreksi opname mengubah stok tanpa
  // ada transaksi fisik di baliknya, jadi angkanya harus terlihat
  // sebelum dikonfirmasi, bukan sekadar "yakin?".
  bukaPanel('Koreksi opname', `
    <div class="card">
      <table class="mini">
        <tr><th class="kiri">Item</th><th>Sistem</th><th>Fisik</th><th>Selisih</th></tr>
        ${baris.map(b => {
          const d = b.fisik - b.sistem;
          return `<tr>
            <td class="kiri">${esc(M.namaProduk(b.kode_produk))}
              ${b.grade ? '· ' + esc(b.grade) : ''}</td>
            <td>${fmt(b.sistem)}</td><td>${fmt(b.fisik)}</td>
            <td style="color:${d < 0 ? 'var(--gC)' : 'var(--gA)'}"><b>${d > 0 ? '+' : ''}${fmt(d)}</b></td>
          </tr>`;
        }).join('')}
      </table>
      <label for="op_tgl">Tanggal opname</label>
      <input type="date" id="op_tgl" value="${hariIni()}">
      <div class="tombol-baris">
        <button class="garis" onclick="tutupPanel()">Batal</button>
        <button class="teal" onclick='jalankanOpname(${JSON.stringify(baris)})'>Simpan koreksi</button>
      </div>
    </div>`);
}

async function jalankanOpname(baris){
  const tgl = document.getElementById('op_tgl').value || hariIni();
  tutupPanel();
  try {
    const r = await kirim('opnameKain', {batch_id: batchId('OPNAME'), tanggal: tgl, baris}, 'Opname');
    toast(r ? `${r.baris} item dikoreksi` : 'Masuk antrian');
    await sinkron(false);
  } catch (e) { toast(e.message, true); }
}

/* Panel yang naik dari bawah, dipakai untuk setelan maupun konfirmasi.
   Menggantikan prompt() dan confirm() bawaan peramban: dialog bawaan
   tampil sebagai kotak sistem yang tidak mengikuti tampilan aplikasi,
   tidak bisa menampilkan angka pembanding, dan prompt() diblokir di
   sebagian peramban serta saat aplikasi dipasang di layar utama. */
function bukaPanel(judul, isi){
  document.getElementById('panel-judul').textContent = judul;
  document.getElementById('panel-isi').innerHTML = isi;
  document.getElementById('tirai').classList.add('on');
}
function tutupPanel(){
  document.getElementById('tirai').classList.remove('on');
}
function bukaSetelan(){
  bukaPanel('Setelan', htmlSetelan());
}

function htmlSetelan(){
  return `
    <div class="card">
      <label for="s_url">URL Web App Apps Script</label>
      <input id="s_url" value="${esc(CFG.url)}" placeholder="https://script.google.com/macros/s/…/exec">
      <label for="s_token">Token</label>
      <input id="s_token" value="${esc(CFG.token)}" placeholder="sama dengan CONFIG.TOKEN di Kain.gs">
      <p class="sub" style="margin:6px 0 0">Token disimpan di HP ini saja, tidak ikut ke GitHub.
      Harus sama persis dengan <b>CONFIG.TOKEN</b> di Kain.gs.</p>
      <div class="tombol-baris">
        <button onclick="simpanSetelan()">Simpan &amp; uji sambungan</button>
      </div>
      <div class="tombol-baris">
        <button class="garis" onclick="jalankanSetup()">Buat sheet (sekali saja)</button>
        <button class="garis" onclick="bukaUrlMentah()">Uji URL</button>
      </div>
    </div>
    <div class="eyebrow">Versi aplikasi</div>
    <div class="card">
      <div class="baris" style="align-items:center">
        <div><b class="num">${VERSI}</b>
          <div class="sub">Cocokkan dengan versi yang Anda upload ke GitHub.</div></div>
        <div style="flex:none"><button class="garis kecil" onclick="paksaMuatUlang()">Muat ulang paksa</button></div>
      </div>
    </div>
    <div class="eyebrow">Kalau sambungan gagal</div>
    <div class="card">
      <ol class="sub" style="margin:0;padding-left:20px;line-height:1.7">
        <li>Deployment belum disetel <b>Siapa saja</b> pada "Siapa yang punya akses".</li>
        <li>Skrip belum pernah diberi izin — jalankan <b>setup_</b> sekali di editor.</li>
        <li>Kode diubah tapi belum dibuat <b>Deployment baru</b>.</li>
        <li>Token berbeda dengan yang di Kain.gs.</li>
      </ol>
    </div>`;
}

async function simpanSetelan(){
  const u = document.getElementById('s_url').value.trim();
  const t = document.getElementById('s_token').value.trim();
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u))
    return toast('URL harus diakhiri /exec', true);
  if (!t) return toast('Token belum diisi', true);
  CFG.url = u; CFG.token = t;
  statusKepala();
  const ok = await sinkron(true);
  if (ok) tutupPanel();
}

/** Buang service worker dan cache-nya, lalu ambil ulang dari GitHub.
 *  Dipakai kalau HP masih menjalankan versi lama setelah berkas diganti. */
async function paksaMuatUlang(){
  try {
    if ('serviceWorker' in navigator) {
      const daftar = await navigator.serviceWorker.getRegistrations();
      await Promise.all(daftar.map(r => r.unregister()));
    }
    if (window.caches) {
      const kunci = await caches.keys();
      await Promise.all(kunci.map(k => caches.delete(k)));
    }
  } catch (e) {}
  location.reload(true);
}

async function jalankanSetup(){
  try {
    const r = await panggil('setup');
    toast(r.dibuat.length ? `${r.dibuat.length} sheet dibuat` : 'Semua sheet sudah ada');
    await sinkron(false);
  } catch (e) { toast(e.message, true); }
}

/* =========================================================
   7. JALANKAN
   Urutannya penting: cache dimuat dan digambar LEBIH DULU,
   baru server dihubungi di latar. Jadi aplikasi langsung
   terpakai walau jaringan lambat atau mati.
   ========================================================= */
document.querySelectorAll('nav button').forEach(b =>
  b.addEventListener('click', () => buka(b.dataset.t)));
document.getElementById('btn-set').addEventListener('click', bukaSetelan);
document.getElementById('btn-sync').addEventListener('click', () => sinkron(true));
document.getElementById('tirai').addEventListener('click', e => {
  if (e.target.id === 'tirai') tutupPanel();
});

window.addEventListener('online',  () => { statusKepala(); sinkron(false); });
window.addEventListener('offline', statusKepala);

(function mulai(){
  muatCache();
  statusKepala();
  gambar();

  // Antrean offline disiapkan di latar. Sengaja TIDAK ditunggu:
  // kalau IndexedDB lambat atau diblokir peramban, aplikasi tetap
  // harus bisa menarik data. Dulu ini di-await, dan sekali saja
  // gagal terbuka, sinkron tidak pernah jalan sama sekali.
  bukaDB().then(perbaruiAntrian).catch(() => {});

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (CFG.siap) sinkron(false);
})();
</script>
